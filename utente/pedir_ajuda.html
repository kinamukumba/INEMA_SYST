<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INEMA - Pedir Ajuda</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    
    <style>
        .step-container { max-width: 600px; margin: 0 auto; }
        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.4s ease; }

        .type-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-top: 2rem; }
        .type-card {
            background: white; border: 2px solid #f1f5f9; padding: 1.5rem; border-radius: 1rem;
            text-align: center; cursor: pointer; transition: all 0.2s;
        }
        .type-card:hover { border-color: var(--primary-blue); background: #f8fafc; }
        .type-card.selected { border-color: var(--primary-blue); background: #f0f9ff; box-shadow: 0 4px 15px rgba(35, 44, 95, 0.1); }
        .type-card i { font-size: 2rem; color: var(--primary-blue); margin-bottom: 1rem; display: block; }
        .type-card h3 { font-size: 0.9rem; font-weight: 700; color: var(--primary-blue); }

        .form-group { margin-bottom: 1.5rem; }
        .form-label { display: block; font-weight: 700; font-size: 0.85rem; color: var(--primary-blue); margin-bottom: 0.5rem; }
        .form-control { width: 100%; padding: 0.875rem 1.25rem; border: 1px solid #e2e8f0; border-radius: 0.75rem; font-size: 1rem; box-sizing: border-box; }

        .btn-group { display: flex; gap: 1rem; margin-top: 2rem; }
        .btn-next, .btn-submit { flex: 2; background-color: var(--primary-blue); color: white; border: none; padding: 1rem; border-radius: 0.75rem; font-weight: 700; cursor: pointer; }
        .btn-prev { flex: 1; background-color: #f1f5f9; color: #64748b; border: none; padding: 1rem; border-radius: 0.75rem; font-weight: 700; cursor: pointer; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <i class="fa-solid fa-asterisk"></i>
                <span>INEMA</span>
            </div>
            <nav class="nav-menu">
                <a href="index.html" class="nav-link">
                    <i class="fa-solid fa-house"></i> Início
                </a>
                <a href="pedir_ajuda.html" class="nav-link active">
                    <i class="fa-solid fa-circle-exclamation"></i> Nova Ocorrência
                </a>
                <a href="acompanhamento.html" class="nav-link">
                    <i class="fa-solid fa-map-location-dot"></i> Acompanhamento
                </a>
                <a href="perfil.html" class="nav-link">
                    <i class="fa-solid fa-user"></i> O Meu Perfil
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="greeting">
                    <h2 style="font-size: 1.1rem; font-weight: 700;">Nova Solicitação</h2>
                </div>
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <div style="text-align: right;">
                        <p style="font-size: 0.85rem; font-weight: 800; color: var(--primary-blue);" id="userFullName">Carregando...</p>
                        <p style="font-size: 0.7rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase;">Cidadão</p>
                    </div>
                    <div style="width: 45px; height: 45px; border-radius: 50%; background-color: #f0f2f5; display: flex; align-items: center; justify-content: center; color: var(--text-muted);">
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>
            </header>

            <div class="content-wrapper">
                <div class="step-container">
                    <!-- Step 1: Categoria -->
                    <div id="step1" class="step active">
                        <h1 style="font-weight: 800; color: var(--primary-blue); text-align: center;">O que está a acontecer?</h1>
                        <p style="text-align: center; color: var(--text-muted);">Selecione o tipo de emergência para continuarmos.</p>
                        
                        <div class="type-grid" id="categoryGrid">
                            <!-- Carregado via API -->
                        </div>
                        
                        <div class="btn-group">
                            <button class="btn-next" onclick="nextStep()" id="btnNext1" disabled>Próximo Passo</button>
                        </div>
                    </div>

                    <!-- Step 2: Detalhes -->
                    <div id="step2" class="step">
                        <h1 style="font-weight: 800; color: var(--primary-blue); text-align: center;">Detalhes do Local</h1>
                        <p style="text-align: center; color: var(--text-muted);">Ajude-nos a chegar até si mais rápido.</p>

                        <div class="card" style="margin-top: 2rem; padding: 2rem;">
                            <div class="form-group">
                                <label class="form-label">Onde se encontra? (Ponto de referência)</label>
                                <input type="text" id="localizacao" class="form-control" placeholder="Ex: Largo da Mutamba, frente ao BPC">
                            </div>

                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                                <div class="form-group">
                                    <label class="form-label">Nº de Vítimas</label>
                                    <input type="number" id="num_vitimas" class="form-control" value="1">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Feridos Graves?</label>
                                    <select id="feridos_graves" class="form-control">
                                        <option value="nao">Não</option>
                                        <option value="sim">Sim</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Observações Adicionais</label>
                                <textarea id="observacoes" class="form-control" style="height: 100px;" placeholder="Descreva brevemente a situação..."></textarea>
                            </div>
                        </div>

                        <div class="btn-group">
                            <button class="btn-prev" onclick="prevStep()">Voltar</button>
                            <button class="btn-submit" id="btnSubmitSos">Solicitar Socorro Agora</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/api.js"></script>
    <script>
        let selectedCategoryId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const user = await loadUserData();
            if (user) {
                document.getElementById('userFullName').textContent = user.nome;
            }
            loadCategories();
        });

        async function loadCategories() {
            const res = await ApiClient.get('utente.php?action=get_categories');
            if (res.success) {
                const grid = document.getElementById('categoryGrid');
                grid.innerHTML = res.data.map(cat => `
                    <div class="type-card" onclick="selectCategory(${cat.id}, this)">
                        <i class="fa-solid fa-kit-medical"></i>
                        <h3>${cat.nome_categoria}</h3>
                    </div>
                `).join('');
            }
        }

        function selectCategory(id, el) {
            selectedCategoryId = id;
            document.querySelectorAll('.type-card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
            document.getElementById('btnNext1').disabled = false;
        }

        function nextStep() {
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
        }

        function prevStep() {
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step1').classList.add('active');
        }

        document.getElementById('btnSubmitSos').addEventListener('click', async () => {
            const btn = document.getElementById('btnSubmitSos');
            btn.disabled = true;
            btn.textContent = 'Processando...';

            const payload = {
                categoria_id: selectedCategoryId,
                localizacao: document.getElementById('localizacao').value,
                num_vitimas: document.getElementById('num_vitimas').value,
                feridos_graves: document.getElementById('feridos_graves').value,
                observacoes: document.getElementById('observacoes').value
            };

            const res = await ApiClient.post('utente.php?action=submit_sos', payload);
            
            if (res.success) {
                alert(res.message);
                window.location.href = 'acompanhamento.html';
            } else {
                alert(res.message);
                btn.disabled = false;
                btn.textContent = 'Solicitar Socorro Agora';
            }
        });
    </script>
</body>
</html>
