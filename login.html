<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INEMA - Entrar no Sistema</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/main.css">
    
    <style>
        body {
            background: linear-gradient(135deg, var(--primary-blue) 0%, #303b7a 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-box {
            width: 80px;
            height: 80px;
            background-color: var(--white);
            border-radius: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            font-size: 2.5rem;
            color: var(--primary-blue);
        }

        .login-header h1 { color: var(--white); font-size: 1.75rem; font-weight: 800; }
        .login-header p { color: rgba(255,255,255,0.7); font-size: 0.95rem; margin-top: 0.5rem; }

        .form-card { background: white; padding: 2.5rem; border-radius: 1.5rem; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        .form-group { margin-bottom: 1.5rem; }
        .form-label { display: block; font-weight: 700; font-size: 0.85rem; color: var(--primary-blue); margin-bottom: 0.5rem; }
        .form-control { width: 100%; padding: 0.875rem 1.25rem; border: 1px solid #e2e8f0; border-radius: 0.75rem; font-size: 1rem; box-sizing: border-box; }

        .btn-login {
            width: 100%; background-color: var(--primary-blue); color: white; border: none; padding: 1.1rem;
            border-radius: 0.75rem; font-weight: 700; font-size: 1rem; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 0.75rem; transition: all 0.2s;
        }

        .btn-login:disabled { background-color: #94a3b8; cursor: not-allowed; }

        .form-footer { text-align: center; margin-top: 2rem; font-size: 0.875rem; color: #64748b; }
        .form-footer a { color: var(--primary-blue); font-weight: 700; text-decoration: none; }

        .error-message { background: #fef2f2; color: #ef4444; padding: 1rem; border-radius: 0.5rem; margin-bottom: 1.5rem; font-size: 0.85rem; font-weight: 600; text-align: center; display: none; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="logo-box">
                <i class="fa-solid fa-asterisk"></i>
            </div>
            <h1>INEMA Online</h1>
            <p>Sistema de Gestão de Emergências</p>
        </div>

        <div class="form-card">
            <div id="errorMessage" class="error-message"></div>

            <form id="loginForm">
                <input type="hidden" name="login_type" value="utente">
                
                <div class="form-group">
                    <label class="form-label">E-mail</label>
                    <input type="email" id="email" class="form-control" placeholder="exemplo@email.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Palavra-passe</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-login" id="btnLogin">
                    <span>Entrar no Sistema</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="form-footer">
                <p>Não tem uma conta? <br> <a href="register.html">Cadastre-se como utente</a></p>
            </div>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnLogin');
            const errorEl = document.getElementById('errorMessage');
            
            errorEl.style.display = 'none';
            btn.disabled = true;
            btn.querySelector('span').textContent = 'Autenticando...';

            const credentials = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                login_type: 'utente'
            };

            const res = await ApiClient.post('auth.php?action=login', credentials);

            if (res.success) {
                // Redirecionamento baseado no tipo de usuário retornado
                if (res.data.redirect === 'admin') window.location.href = 'admin/dashboard.html';
                else if (res.data.redirect === 'base') window.location.href = 'base/dashboard.html';
                else window.location.href = 'utente/index.html';
            } else {
                errorEl.textContent = res.message;
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.querySelector('span').textContent = 'Entrar no Sistema';
            }
        });
    </script>
</body>
</html>
