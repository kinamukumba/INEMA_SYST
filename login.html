<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INEMA - Entrar no Sistema</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/main.css">
    
    <style>
        body {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-box {
            width: 80px;
            height: 80px;
            background-color: var(--white);
            border-radius: var(--radius-xl);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: var(--shadow-lg);
            font-size: 2.5rem;
            color: var(--primary);
        }

        .login-header h1 {
            color: var(--white);
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.025em;
        }

        .login-header p {
            color: rgba(255,255,255,0.7);
            font-size: 0.95rem;
            margin-top: 0.5rem;
        }

        .form-footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.875rem;
        }

        .form-footer a {
            color: var(--secondary);
            font-weight: 600;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Float background elements */
        .shape {
            position: absolute;
            z-index: -1;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="shape" style="width: 300px; height: 300px; top: -100px; left: -100px;"></div>
    <div class="shape" style="width: 500px; height: 500px; bottom: -200px; right: -200px;"></div>

    <div class="login-card">
        <div class="login-header">
            <div class="logo-box">
                <i class="fa-solid fa-truck-medical"></i>
            </div>
            <h1>INEMA Online</h1>
            <p>Sistema de Gestão de Emergências</p>
        </div>

        <div class="card">
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">E-mail ou Nº Mecanográfico</label>
                    <input type="text" class="form-control" placeholder="exemplo@inema.ao" required>
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                        <label class="form-label" style="margin-bottom: 0;">Senha</label>
                        <a href="#" style="font-size: 0.75rem; color: var(--primary); font-weight: 600;">Esqueceu?</a>
                    </div>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                    Entrar no Sistema
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="form-footer">
                <p style="color: var(--text-muted);">Não tem uma conta? <br> <a href="register.html">Cadastre-se como utente</a></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Simulação de login
            const btn = this.querySelector('button');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Autenticando...';
            
            setTimeout(() => {
                // Redireciona para o admin por padrão nesta demo
                window.location.href = 'dashboard/index.html';
            }, 1200);
        });
    </script>
</body>
</html>
