<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INEMA - Criar Conta</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/main.css">
    
    <style>
        body {
            background-color: #f4f7f6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .register-card {
            background-color: white;
            width: 100%;
            max-width: 480px;
            padding: 3.5rem;
            border-radius: 1.25rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.04);
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        .icon-top {
            width: 60px;
            height: 60px;
            background-color: var(--primary-yellow);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 1.5rem;
            color: var(--primary-blue);
        }

        .register-card h1 {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--primary-blue);
            margin-bottom: 0.5rem;
        }

        .register-card p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 3rem;
            line-height: 1.5;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--primary-blue);
            margin-bottom: 0.5rem;
        }

        .form-control {
            width: 100%;
            padding: 0.875rem 1.25rem;
            border: 1px solid #e9ecef;
            border-radius: 0.75rem;
            font-size: 1rem;
            background-color: white;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px rgba(35, 44, 95, 0.05);
            outline: none;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 1rem;
        }

        .btn-register {
            width: 100%;
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 1.1rem;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 700;
            margin-top: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            transition: all 0.2s;
        }

        .btn-register:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .footer-link {
            margin-top: 2rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .footer-link a {
            color: var(--primary-blue);
            font-weight: 700;
            text-decoration: none;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="icon-top">
            <i class="fa-solid fa-user-plus"></i>
        </div>
        <h1>Criar Conta de Utente</h1>
        <p class="subtitle">Registe-se para poder solicitar socorro de emergência</p>

        <form>
            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" class="form-control" placeholder="João da Silva">
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" placeholder="joao@email.com">
                </div>
                <div class="form-group">
                    <label>Telefone</label>
                    <input type="tel" class="form-control" placeholder="+(244) 9XX XXX XXX">
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Palavra-passe</label>
                    <input type="password" class="form-control" placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label>Confirmar Senha</label>
                    <input type="password" class="form-control" placeholder="••••••••">
                </div>
            </div>

            <button type="button" class="btn-register" onclick="window.location.href='login.html'">
                <i class="fa-solid fa-user-check"></i>
                Criar Conta
            </button>
        </form>

        <div class="footer-link">
            Já tem uma conta? <a href="login.html">Entrar aqui</a>
        </div>
    </div>
</body>
</html>
