<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel INEMA - Resumo</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>

    <!-- Header Interno -->
    <header class="dash-header">
        <div class="container">
            <div class="user-profile">
                <div class="avatar-circle">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="user-info">
                    <h2>Moisés Kialanda</h2>
                    <p>Usuário 54321</p>
                </div>
            </div>
            <!-- Nada no lado direito nesta view (conforme a UI #1) -->
        </div>
    </header>

    <!-- Conteúdo Painel -->
    <main class="dash-content container animate-on-scroll is-visible fade-in">
        
        <!-- Topo: Total -->
        <div class="card-dash total-header-card">
            <p>TOTAL DE OCORRÊNCIAS</p>
            <h3>132</h3>
        </div>

        <div class="painel-grid">
            <!-- Sidebar Acessos Rápidos -->
            <div class="card-dash">
                <p style="color:var(--text-muted); font-size:13px; margin-bottom: 20px;">Acessos Rápidos</p>
                <nav class="sidebar-menu">
                    <ul>
                        <li>
                            <a href="perfil.html" class="bg-grey">
                                <div class="menu-icon active"><i class="fa-solid fa-user"></i></div>
                                Perfil
                            </a>
                        </li>
                        <li>
                            <a href="#">
                                <div class="menu-icon"><i class="fa-solid fa-bell"></i></div>
                                Notificação
                            </a>
                        </li>
                        <li>
                            <a href="index.html">
                                <div class="menu-icon"></div>
                                Ir ao Início
                            </a>
                        </li>
                        <li>
                            <a href="login.html">
                                <div class="menu-icon"></div>
                                Terminar Sessão
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>

            <!-- Area Principal: Registrar -->
            <div>
                <div class="card-dash action-card" onclick="window.location.href='dashboard.html'" style="cursor:pointer;">
                    <i class="fa-solid fa-truck-medical action-siren"></i>
                    <h2>Registrar Ocorrência</h2>
                    <p>Clique no botão abaixo para registrar uma ocorrência</p>
                    <div class="action-plus">
                        <i class="fa-solid fa-plus"></i>
                    </div>
                </div>

                <!-- Pendentes -->
                <div class="card-dash pending-card">
                    <p>Pendentes</p>
                    <div style="display:flex; height:100%; align-items:center; justify-content:center; padding: 20px 0;">
                        <h4>Demomento não há alguma ocorrência pendente</h4>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script src="assets/js/dashboard.js"></script>
</body>
</html>
