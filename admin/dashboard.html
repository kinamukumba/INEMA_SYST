<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INEMA Central - Triagem</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    
    <style>
        .triage-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
        }

        .triage-card {
            border-left: 6px solid #ef4444;
            padding: 2rem;
            position: relative;
        }

        .triage-card.approved { border-left-color: #10b981; }

        .occ-id {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            font-size: 0.75rem;
            font-weight: 800;
            color: #8c909c;
        }

        .occ-type {
            font-size: 1.1rem;
            font-weight: 800;
            color: #232c5f;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .occ-meta {
            font-size: 0.85rem;
            color: #8c909c;
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .occ-meta span i { width: 18px; color: #232c5f; }

        .action-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn-approve {
            flex: 2;
            background-color: #232c5f;
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 0.5rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-reject {
            flex: 1;
            background-color: #fef2f2;
            color: #ef4444;
            border: 1px solid #fee2e2;
            padding: 0.8rem;
            border-radius: 0.5rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-approve:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar admin-sidebar">
            <div class="sidebar-logo">
                <i class="fa-solid fa-satellite-dish" style="color: #ebb924;"></i>
                <span>INEMA Central</span>
            </div>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-link active">
                    <i class="fa-solid fa-tower-broadcast"></i> Triagem
                </a>
                <a href="ocorrencias.html" class="nav-link">
                    <i class="fa-solid fa-list-ul"></i> Ocorrências
                </a>
                <a href="estatisticas.html" class="nav-link">
                    <i class="fa-solid fa-chart-pie"></i> Estatísticas
                </a>
                <a href="registar_base.html" class="nav-link">
                    <i class="fa-solid fa-building-circle-plus"></i> Registar Base
                </a>
                <a href="gestao_bases.html" class="nav-link">
                    <i class="fa-solid fa-city"></i> Gestão de Bases
                </a>
                
                <a href="index.html" class="nav-link logout">
                    <i class="fa-solid fa-right-from-bracket"></i> Sair
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <h2 style="font-size: 1.1rem; font-weight: 800; color: #232c5f;">Triagem de Emergências</h2>
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <div style="text-align: right;">
                        <p style="font-size: 0.85rem; font-weight: 800; color: #232c5f;" id="adminName">Carregando...</p>
                        <p style="font-size: 0.7rem; font-weight: 600; color: #8c909c; text-transform: uppercase;">Administrador</p>
                    </div>
                    <div style="width: 45px; height: 45px; border-radius: 50%; background-color: #f0f2f5; display: flex; align-items: center; justify-content: center; color: #8c909c;"><i class="fa-solid fa-user"></i></div>
                </div>
            </header>

            <div class="content-wrapper">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                    <h3 style="font-weight: 800; color: #232c5f;">Ocorrências Aguardando Triagem</h3>
                    <span id="urgentCount" style="display:none; background: #ef4444; color: white; padding: 0.25rem 0.75rem; border-radius: 2rem; font-size: 0.75rem; font-weight: 800;">0 URGENTES</span>
                </div>

                <div class="triage-grid" id="triageGrid">
                    <!-- Carregado via API -->
                    <p style="text-align: center; color: #8c909c; padding: 3rem; grid-column: 1/-1;">Buscando novas ocorrências...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await loadUserData();
            if (user) {
                document.getElementById('adminName').textContent = user.nome;
            }
            
            loadPendingOccurrences();
            
            // Atualizar a cada 15 segundos
            setInterval(loadPendingOccurrences, 15000);
        });

        async function loadPendingOccurrences() {
            const res = await ApiClient.get('admin.php?action=get_pending_occurrences');
            const grid = document.getElementById('triageGrid');
            const urgentBadge = document.getElementById('urgentCount');
            
            // Buscar bases para o select
            const basesRes = await ApiClient.get('admin.php?action=get_bases');
            const bases = basesRes.success ? basesRes.data : [];

            if (res.success) {
                if (res.data.length === 0) {
                    grid.innerHTML = '<p style="text-align: center; color: #8c909c; padding: 3rem; grid-column: 1/-1;">Nenhuma ocorrência pendente no momento.</p>';
                    urgentBadge.style.display = 'none';
                    return;
                }

                urgentBadge.textContent = `${res.data.length} PENDENTES`;
                urgentBadge.style.display = 'block';

                grid.innerHTML = res.data.map(occ => `
                    <div class="card triage-card" id="occ-${occ.id}">
                        <span class="occ-id">#${occ.id}</span>
                        <div class="occ-type">
                            <i class="fa-solid fa-truck-medical" style="color: #ef4444;"></i>
                            ${occ.nome_categoria}
                        </div>
                        <div class="occ-meta">
                            <span><i class="fa-solid fa-user"></i> ${occ.utente_nome}</span>
                            <span><i class="fa-solid fa-location-dot"></i> ${occ.localizacao_texto}</span>
                            <span><i class="fa-solid fa-clock"></i> ${new Date(occ.data_abertura).toLocaleTimeString()}</span>
                        </div>
                        
                        <div style="margin: 1rem 0;">
                            <label style="font-size: 0.75rem; font-weight: 700; color: #232c5f; display: block; margin-bottom: 0.5rem;">Direcionar para Base:</label>
                            <select class="form-control base-select" id="base-select-${occ.id}" style="padding: 0.5rem; font-size: 0.8rem;">
                                ${bases.map(b => `<option value="${b.id}">${b.nome_base} (${b.municipio})</option>`).join('')}
                            </select>
                        </div>

                        <div class="action-group">
                            <button class="btn-reject" onclick="reject(${occ.id})">Rejeitar</button>
                            <button class="btn-approve" onclick="approve(${occ.id}, this)">Aprovar e Enviar</button>
                        </div>
                    </div>
                `).join('');
            }
        }

        async function approve(id, btn) {
            const baseId = document.getElementById(`base-select-${id}`).value;
            if (!baseId) {
                alert('Por favor, selecione uma base.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Processando...';
            
            const res = await ApiClient.post('admin.php?action=approve_occurrence', { 
                id: id,
                base_id: baseId
            });
            
            if (res.success) {
                const card = document.getElementById(`occ-${id}`);
                card.classList.add('approved');
                btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> Enviado';
                btn.style.backgroundColor = '#10b981';
                
                setTimeout(() => {
                    card.style.opacity = '0';
                    card.style.transform = 'translateX(100px)';
                    setTimeout(() => {
                        card.remove();
                        if (document.querySelectorAll('.triage-card').length === 0) {
                            document.getElementById('triageGrid').innerHTML = '<p style="text-align: center; color: #8c909c; padding: 3rem; grid-column: 1/-1;">Nenhuma ocorrência pendente no momento.</p>';
                        }
                    }, 500);
                }, 1000);
            } else {
                alert(res.message);
                btn.disabled = false;
                btn.textContent = 'Aprovar e Enviar';
            }
        }

        async function reject(id) {
            if (!confirm('Tem certeza que deseja rejeitar esta ocorrência?')) return;
            
            const res = await ApiClient.post('admin.php?action=reject_occurrence', { id: id });
            if (res.success) {
                const card = document.getElementById(`occ-${id}`);
                card.style.opacity = '0';
                setTimeout(() => card.remove(), 500);
            } else {
                alert(res.message);
            }
        }
    </script>
</body>
</html>
