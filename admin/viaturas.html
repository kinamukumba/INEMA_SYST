<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INEMA Admin - Viaturas</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    
    <style>
        .vehicle-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .vehicle-card {
            padding: 1.5rem;
            position: relative;
        }

        .vehicle-status {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
        }

        .vehicle-info h3 { margin-bottom: 0.5rem; font-weight: 700; }
        .vehicle-info p { font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1rem; }

        .progress-bar {
            height: 8px;
            background-color: #f1f5f9;
            border-radius: 4px;
            margin: 1rem 0;
            overflow: hidden;
        }

        .progress-fill { height: 100%; background-color: var(--primary-yellow); }

        .badge { padding: 0.25rem 0.75rem; border-radius: var(--radius-full); font-size: 0.7rem; font-weight: 700; }
        .badge-success { background-color: #dcfce7; color: #166534; }
        .badge-warning { background-color: #fffbeb; color: #92400e; }
        .badge-danger { background-color: #fef2f2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar Admin -->
        <aside class="sidebar admin-sidebar">
            <div class="sidebar-logo">
                <i class="fa-solid fa-satellite-dish" style="color: #ebb924;"></i>
                <span>INEMA Central</span>
            </div>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-link">
                    <i class="fa-solid fa-tower-broadcast"></i> Triagem
                </a>
                <a href="ocorrencias.html" class="nav-link">
                    <i class="fa-solid fa-list-ul"></i> Ocorrências
                </a>
                <a href="estatisticas.html" class="nav-link">
                    <i class="fa-solid fa-chart-pie"></i> Estatísticas
                </a>
                <a href="registar_base.html" class="nav-link">
                    <i class="fa-solid fa-building-circle-plus"></i> Registar Base
                </a>
                <a href="gestao_bases.html" class="nav-link">
                    <i class="fa-solid fa-city"></i> Gestão de Bases
                </a>
                <a href="viaturas.html" class="nav-link active">
                    <i class="fa-solid fa-ambulance"></i> Viaturas
                </a>
                
                <a href="#" class="nav-link logout" id="btnLogout">
                    <i class="fa-solid fa-right-from-bracket"></i> Sair
                </a>
            </nav>
        </aside>

        <!-- Main -->
        <main class="main-content">
            <header class="top-bar">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <span style="font-weight: 700; font-size: 1.25rem;">Frota Nacional INEMA</span>
                </div>
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <div style="text-align: right;">
                        <p style="font-size: 0.85rem; font-weight: 800; color: #232c5f;" id="adminName">Carregando...</p>
                        <p style="font-size: 0.7rem; font-weight: 600; color: #8c909c; text-transform: uppercase;">Administrador</p>
                    </div>
                    <div style="width: 45px; height: 45px; border-radius: 50%; background-color: #f0f2f5; display: flex; align-items: center; justify-content: center; color: #8c909c;"><i class="fa-solid fa-user"></i></div>
                </div>
            </header>

            <div class="content-wrapper">
                <div class="vehicle-grid" id="vehicleGrid">
                    <!-- Carregado via API -->
                    <p style="text-align: center; color: #8c909c; padding: 3rem; grid-column: 1/-1;">Buscando viaturas em todo o país...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await loadUserData();
            if (user) {
                document.getElementById('adminName').textContent = user.nome;
            }
            
            loadAllVehicles();

            document.getElementById('btnLogout').addEventListener('click', async (e) => {
                e.preventDefault();
                await ApiClient.get('auth.php?action=logout');
                window.location.href = '../login.html';
            });
        });

        async function loadAllVehicles() {
            const res = await ApiClient.get('admin.php?action=get_all_vehicles');
            const grid = document.getElementById('vehicleGrid');
            
            if (res.success) {
                if (res.data.length === 0) {
                    grid.innerHTML = '<p style="text-align: center; color: #8c909c; padding: 3rem; grid-column: 1/-1;">Nenhuma viatura cadastrada no sistema.</p>';
                    return;
                }

                grid.innerHTML = res.data.map(vehicle => `
                    <div class="card vehicle-card">
                        <div class="vehicle-status">
                            <span class="badge ${getStatusBadge(vehicle.status)}">${vehicle.status.toUpperCase()}</span>
                        </div>
                        <div class="vehicle-info">
                            <i class="fa-solid fa-truck-medical" style="font-size: 2rem; color: var(--primary-blue); margin-bottom: 1rem; display: block;"></i>
                            <h3>${vehicle.matricula}</h3>
                            <p>${vehicle.tipo} • <strong>Base: ${vehicle.nome_base}</strong></p>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${vehicle.nivel_combustivel}%; background-color: ${getFuelColor(vehicle.nivel_combustivel)};"></div>
                            </div>
                            <div style="display: flex; justify-content: space-between; font-size: 0.75rem;">
                                <span>Combustível</span>
                                <span>${vehicle.nivel_combustivel}%</span>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        }

        function getStatusBadge(status) {
            switch(status) {
                case 'disponivel': return 'badge-success';
                case 'em_servico': return 'badge-warning';
                case 'manutencao': return 'badge-danger';
                default: return '';
            }
        }

        function getFuelColor(level) {
            if (level > 50) return '#10b981';
            if (level > 20) return '#f59e0b';
            return '#ef4444';
        }
    </script>
</body>
</html>
