<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INEMA Admin - Viaturas</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    
    <style>
        .vehicle-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .vehicle-card {
            padding: 1.5rem;
            position: relative;
        }

        .vehicle-status {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
        }

        .vehicle-info h3 { margin-bottom: 0.5rem; font-weight: 700; }
        .vehicle-info p { font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1rem; }

        .progress-bar {
            height: 8px;
            background-color: #f1f5f9;
            border-radius: 4px;
            margin: 1rem 0;
            overflow: hidden;
        }

        .progress-fill { height: 100%; background-color: var(--primary-yellow); }

        .badge { padding: 0.25rem 0.75rem; border-radius: var(--radius-full); font-size: 0.7rem; font-weight: 700; }
        .badge-success { background-color: #dcfce7; color: #166534; }
        .badge-warning { background-color: #fffbeb; color: #92400e; }
        .badge-danger { background-color: #fef2f2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar Admin -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <i class="fa-solid fa-truck-medical text-yellow"></i>
                <span>INEMA Base</span>
            </div>
            <nav class="nav-menu">
                <a href="index.html" class="nav-link">
                    <i class="fa-solid fa-chart-line"></i> Dashboard
                </a>
                <a href="ocorrencias.html" class="nav-link">
                    <i class="fa-solid fa-list-check"></i> Ocorrências
                </a>
                <a href="viaturas.html" class="nav-link active">
                    <i class="fa-solid fa-ambulance"></i> Viaturas
                </a>
                <a href="equipes.html" class="nav-link">
                    <i class="fa-solid fa-user-group"></i> Equipes
                </a>
            </nav>
            <div style="margin-top: auto;">
                <a href="../login.html" class="nav-link">
                    <i class="fa-solid fa-right-from-bracket"></i> Sair
                </a>
            </div>
        </aside>

        <!-- Main -->
        <main class="main-content">
            <header class="top-bar">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <span style="font-weight: 700; font-size: 1.25rem;">Gestão de Viaturas</span>
                </div>
                <button class="btn btn-primary" style="padding: 0.5rem 1rem; font-size: 0.875rem;">
                    <i class="fa-solid fa-plus"></i> Nova Viatura
                </button>
            </header>

            <div class="content-wrapper">
                <div class="vehicle-grid">
                    <!-- Viatura 1 -->
                    <div class="card vehicle-card">
                        <div class="vehicle-status">
                            <span class="badge badge-success">Disponível</span>
                        </div>
                        <div class="vehicle-info">
                            <i class="fa-solid fa-truck-medical" style="font-size: 2rem; color: var(--primary-blue); margin-bottom: 1rem; display: block;"></i>
                            <h3>LD-01-AM</h3>
                            <p>Toyota Land Cruiser - Suporte Avançado</p>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 85%;"></div>
                            </div>
                            <div style="display: flex; justify-content: space-between; font-size: 0.75rem;">
                                <span>Combustível</span>
                                <span>85%</span>
                            </div>
                        </div>
                    </div>

                    <!-- Viatura 2 -->
                    <div class="card vehicle-card">
                        <div class="vehicle-status">
                            <span class="badge badge-warning">Em Missão</span>
                        </div>
                        <div class="vehicle-info">
                            <i class="fa-solid fa-truck-medical" style="font-size: 2rem; color: var(--primary-blue); margin-bottom: 1rem; display: block;"></i>
                            <h3>LD-04-AM</h3>
                            <p>Mercedes Sprinter - Suporte Básico</p>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 40%;"></div>
                            </div>
                            <div style="display: flex; justify-content: space-between; font-size: 0.75rem;">
                                <span>Combustível</span>
                                <span>40%</span>
                            </div>
                        </div>
                    </div>

                    <!-- Viatura 3 -->
                    <div class="card vehicle-card">
                        <div class="vehicle-status">
                            <span class="badge badge-danger">Manutenção</span>
                        </div>
                        <div class="vehicle-info">
                            <i class="fa-solid fa-truck-medical" style="font-size: 2rem; color: var(--primary-blue); margin-bottom: 1rem; display: block;"></i>
                            <h3>LD-07-AM</h3>
                            <p>Toyota Hiace - Suporte Médio</p>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 15%; background-color: var(--danger);"></div>
                            </div>
                            <div style="display: flex; justify-content: space-between; font-size: 0.75rem;">
                                <span>Combustível</span>
                                <span>15%</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
